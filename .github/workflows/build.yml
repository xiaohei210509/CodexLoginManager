name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test --scratch-path "$RUNNER_TEMP/CodexLoginManager-tests" --disable-index-store -j 1

      - name: Build app bundle
        run: ./script/build_and_run.sh --build

      - name: Verify app bundle
        run: |
          xattr -cr dist/CodexLoginManager.app
          plutil -lint dist/CodexLoginManager.app/Contents/Info.plist
          codesign --verify --deep --strict dist/CodexLoginManager.app
